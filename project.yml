name: Neutrony
options:
  bundleIdPrefix: com.neutrony
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Neutrony:
    type: application
    platform: macOS
    sources:
      - Neutrony
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrony.app
        PRODUCT_NAME: Neutrony
        INFOPLIST_FILE: Neutrony/Info.plist
        CODE_SIGN_ENTITLEMENTS: Neutrony/Neutrony.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    info:
      path: Neutrony/Info.plist
    entitlements:
      path: Neutrony/Neutrony.entitlements
    dependencies:
      - target: FinderSyncExtension
        embed: true
        codeSign: true
        copyPhase:
          destination: plugins
    postBuildScripts:
      - name: Bundle rclone
        script: |
          "${PROJECT_DIR}/scripts/bundle-rclone.sh"
        basedOnDependencyAnalysis: false

  FinderSyncExtension:
    type: finder-sync-extension
    platform: macOS
    sources:
      - FinderSyncExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrony.app.FinderSync
        PRODUCT_NAME: FinderSyncExtension
        INFOPLIST_FILE: FinderSyncExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderSyncExtension/FinderSyncExtension.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    info:
      path: FinderSyncExtension/Info.plist
    entitlements:
      path: FinderSyncExtension/FinderSyncExtension.entitlements

  NeutronyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NeutronyTests
    dependencies:
      - target: Neutrony
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrony.tests
